<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orbit on a Budget</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="top">
    <span class="title">Orbit on a Budget</span>
    <span class="mission-label" id="mission-label"></span>
    <span class="budget" id="budget" aria-live="polite"></span>
  </header>

  <div class="stage full" id="stage">
    <aside class="side left" id="left" aria-label="Parts"></aside>
    <main class="center" id="center"></main>
    <aside class="side right" id="right" aria-label="Mission status"></aside>
  </div>

  <footer class="bottom">
    <button class="secondary" id="back" type="button">Back</button>
    <button class="primary" id="next" type="button">Next</button>
  </footer>
</body>
</html>
